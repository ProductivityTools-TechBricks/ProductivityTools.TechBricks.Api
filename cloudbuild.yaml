steps:
  # Install dependencies
- name: python
  entrypoint: pip
  args: ["install", "-r", "requirements.txt", "--user"]

# Docker Build
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t',
         'europe-west1-docker.pkg.dev/${PROJECT_ID}/pttechbricks-cloudbuild/image:${SHORT_SHA}', '.']

# Docker push to Google Artifact Registry
- name: 'gcr.io/cloud-builders/docker'
  args: ['push',  'europe-west1-docker.pkg.dev/${PROJECT_ID}/pttechbricks-cloudbuild/image:${SHORT_SHA}']

# Deploy to Cloud Run
- name: google/cloud-sdk
  args: [ 'gcloud', 'run', 'deploy', 'pt-techbricks-api',
          '--image=europe-west1-docker.pkg.dev/${PROJECT_ID}/pttechbricks-cloudbuild/image:${SHORT_SHA}',
          '--region', 'europe-west1', '--platform', 'managed',
          '--allow-unauthenticated' ,'--update-env-vars', 'GOOGLE_CLOUD_PROJECT=${PROJECT_ID}']

options:
  logging: CLOUD_LOGGING_ONLY